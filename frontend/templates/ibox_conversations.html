{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Client</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'frontend/css/ibox_styles.css' %}">
</head>
<body>
    <div class="email-client">
        <nav class="top-nav">
            <div class="nav-left">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="app-title">Mail</h1>
            </div>
            <div class="nav-center">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search mail">
                </div>
            </div>
            <div class="nav-right">
                <button class="nav-button">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="nav-button">
                    <i class="fas fa-question-circle"></i>
                </button>
                <button class="nav-button user-profile">
                    <img src="static/images/user-avatar.jpg" alt="User Avatar">
                </button>
            </div>
        </nav>

        <div class="main-container">
            <aside class="sidebar">
                <h2>Conversations</h2>
                <button class="compose-emails-btn">Compose</button>
                <ul class="folder-list">
                    <li class="active"><i class="fas fa-inbox"></i> Inbox</li>
                    <li><i class="far fa-paper-plane"></i> Sent</li>
                    <li><i class="far fa-file-alt"></i> Drafts</li>
                    <li><i class="far fa-trash-alt"></i> Trash</li>
                </ul>
            </aside>
    
            <div class="email-list">
                <!-- This will be populated by JavaScript -->
                <div id="email-list-placeholder">Loading emails...</div>
            </div>
    
            <div class="email-content">
                <div class="email-header">
                    <h2 class="email-subject">Welcome to Your Inbox</h2>
                </div>
                <div class="email-messages">
                    <p>Select an email from the list to view its content.</p>
                </div>
                <div class="email-reply" style="display: none;">
                    <textarea placeholder="Type your reply here..."></textarea>
                    <button class="send-reply-btn">Send Reply</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'frontend/js/ibox_scripts.js' %}"></script>
</body>
</html>
