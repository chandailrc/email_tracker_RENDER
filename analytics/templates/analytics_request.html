# Submit Metrics Request

{% csrf_token %}
Campaign ID: <input type="text" id="campaignId" name="campaignId"><br>

Time Period: 
<select id="timePeriod" name="timePeriod">
    <option value="custom">Custom</option>
    <option value="24hrs">24hrs</option>
    <option value="7days">7days</option>
    <option value="1month">1month</option>
</select><br>

Segments: 
<select id="segmentation" name="segmentation">
    <option value="">None</option>
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
</select><br>

Start Date (YYYY-MM-DD): <input type="date" id="startDate" name="startDate"><br>
End Date (YYYY-MM-DD): <input type="date" id="endDate" name="endDate"><br>
Team ID: <input type="text" id="teamId" name="teamId"><br>
User ID: <input type="text" id="userId" name="userId"><br>
Lead Source: <input type="text" id="leadSource" name="leadSource"><br>
Recipient Domain: <input type="text" id="recipientDomain" name="recipientDomain"><br>
Subject Contains: <input type="text" id="subjectContains" name="subjectContains"><br>
Contact List ID: <input type="text" id="contactListId" name="contactListId"><br>

<button onclick="submitRequest()">Submit</button>

## Response

<div id="responseOutput"></div>

<script>
function submitRequest() {
    const data = {
        campaign_id: document.getElementById('campaignId').value,
        time_period: document.getElementById('timePeriod').value,
        segmentation: document.getElementById('segmentation').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        team_id: document.getElementById('teamId').value,
        user_id: document.getElementById('userId').value,
        lead_source: document.getElementById('leadSource').value,
        recipient_domain: document.getElementById('recipientDomain').value,
        subject_contains: document.getElementById('subjectContains').value,
        contactListId: document.getElementById('contactListId').value
    };

    fetch('/api/analytics/metrics/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        const output = document.getElementById('responseOutput');
        if (Array.isArray(data)) {
            // Segmented data
            let html = '<table border="1"><tr><th>Period</th>';
            // Add headers
            for (let key in data[0]) {
                if (key !== 'period') {
                    html += `<th>${key}</th>`;
                }
            }
            html += '</tr>';
            
            // Add data rows
            data.forEach(item => {
                html += `<tr><td>${item.period}</td>`;
                for (let key in item) {
                    if (key !== 'period') {
                        html += `<td>${item[key]}</td>`;
                    }
                }
                html += '</tr>';
            });
            html += '</table>';
            output.innerHTML = html;
        } else {
            // Non-segmented data
            let html = '<table border="1">';
            for (let key in data) {
                html += `<tr><th>${key}</th><td>${data[key]}</td></tr>`;
            }
            html += '</table>';
            output.innerHTML = html;
        }
    })
    .catch((error) => {
        console.error('Error:', error);
        document.getElementById('responseOutput').innerHTML = 'Error: ' + error;
    });
}
</script>
